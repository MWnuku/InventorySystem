<mat-toolbar color="primary" class="toolbar">
  <button mat-icon-button (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Asset Management</span>
</mat-toolbar>
<mat-card>
  <mat-card-header>
    <mat-card-title>{{ asset?.id ? 'Edit Asset' : 'Add Asset' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="assetForm" (ngSubmit)="saveAsset()">

      <!-- Inventory Number -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Inventory Number</mat-label>
        <input matInput formControlName="inventoryNumber" required />
      </mat-form-field>

      <!-- Name -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" required />
      </mat-form-field>

      <!-- Acquisition Date -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Acquisition Date</mat-label>
        <input matInput formControlName="acquisitionDate" required />
      </mat-form-field>

      <!-- Annotations (optional) -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Annotations</mat-label>
        <textarea matInput formControlName="adnotations"></textarea>
      </mat-form-field>

      <!-- Person -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Person</mat-label>
        <mat-select formControlName="personId">
          <mat-option *ngFor="let person of persons" [value]="person.id">
            {{ person.firstName }} {{ person.lastName }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Status -->
      <mat-form-field appearance="fill">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let status of statusOptions" [value]="status">
            {{ status }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Type -->
      <mat-form-field appearance="fill">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let type of typeOptions" [value]="type">
            {{ type }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Room -->
      <mat-form-field appearance="fill">
        <mat-label>Room</mat-label>
        <mat-select formControlName="roomId">
          <mat-option *ngFor="let room of rooms" [value]="room.id">
            {{ room.symbol }} - {{ room.building }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Inventory Field -->
      <mat-form-field appearance="fill">
        <mat-label>Inventory Field</mat-label>
        <mat-select formControlName="inventoryFieldId">
          <mat-option *ngFor="let field of inventoryFields" [value]="field.id">
            {{ field.number }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Value -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Value</mat-label>
        <input matInput formControlName="value" />
      </mat-form-field>

      <div class="button-container">
        <button mat-raised-button color="primary" type="submit">Save</button>
        <button mat-raised-button color="warn" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

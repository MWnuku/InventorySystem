<mat-card>
  <mat-card-header>
    <mat-card-title>{{ asset?.id ? 'Edit Asset' : 'Add Asset' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="assetForm" (ngSubmit)="saveAsset()">

      <!-- Nazwa -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Nazwa</mat-label>
        <input matInput formControlName="name" required />
      </mat-form-field>

      <!-- Data zakupu -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Data zakupu</mat-label>
        <input matInput formControlName="acquisitionDate" required />
      </mat-form-field>

      <!-- Adnotations (opcjonalne) -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Adnotations</mat-label>
        <textarea matInput formControlName="adnotations"></textarea>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Osoba</mat-label>
        <mat-select formControlName="personId">
          <mat-option *ngFor="let person of persons" [value]="person.id">
            {{ person.firstName }} {{ person.lastName }}
          </mat-option>
        </mat-select>
      </mat-form-field>


      <!-- Status Dropdown -->
      <mat-form-field appearance="fill">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let status of statusOptions" [value]="status">
            {{ status }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Type Dropdown -->
      <mat-form-field appearance="fill">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let type of typeOptions" [value]="type">
            {{ type }}
          </mat-option>
        </mat-select>
      </mat-form-field>


      <mat-form-field appearance="fill">
        <mat-label>Room</mat-label>
        <mat-select formControlName="roomId">
          <mat-option *ngFor="let room of rooms" [value]="room.id">
            {{ room.symbol }} - {{ room.building }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Pole inwentaryzacyjne</mat-label>
        <mat-select formControlName="inventoryFieldId">
          <mat-option *ngFor="let field of inventoryFields" [value]="field.id">
            {{ field.number }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="button-container">
        <button mat-raised-button color="primary" type="submit">Save</button>
        <button mat-raised-button color="warn" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
